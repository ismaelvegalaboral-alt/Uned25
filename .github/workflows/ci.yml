name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python and pip info
        run: |
          python -VV
          which python
          python -m pip --version
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -v
      - name: Show NiceGUI install
        run: |
          python -m pip show nicegui || true
          python -m pip freeze | sed -n '1,120p'
      - name: NiceGUI import smoke test
        run: |
          python -c "import nicegui; print('nicegui ok', nicegui.__version__)"
