{% extends 'vacations/base.html' %}
{% block content %}
<header class="page-title row"><div><h1>Histórico de solicitudes</h1><p>Registro completo con documentos PDF integrados.</p></div><a class="primary" href="{% url 'request_create' %}">+ Nueva solicitud</a></header>
<form class="search"><select name="status"><option value="">Todos los estados</option>{% for value,label in statuses %}<option value="{{ value }}" {% if status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><button>Filtrar</button></form>
<section class="card">{% include 'vacations/partials_request_table.html' with requests=requests %}</section>
{% endblock %}
