<div class="table-wrap"><table><thead><tr><th>Trabajador</th><th>Periodo</th><th>Días</th><th>Estado</th><th>Departamento</th><th></th></tr></thead><tbody>{% for r in requests %}<tr><td>{{ r.employee.full_name }}</td><td>{{ r.start_date|date:'d/m/Y' }} - {{ r.end_date|date:'d/m/Y' }}</td><td>{{ r.requested_days }}</td><td><span class="pill {{ r.status }}">{{ r.get_status_display }}</span></td><td>{{ r.employee.department|default:'—' }}</td><td><a href="{% url 'request_detail' r.pk %}">Ver</a></td></tr>{% empty %}<tr><td colspan="6">No hay solicitudes.</td></tr>{% endfor %}</tbody></table></div>
